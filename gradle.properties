android.useAndroidX=true
org.gradle.jvmargs=-Xmx2000m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true
roborazzi.record.namingStrategy=testClassAndMethod
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.newDsl=false
android.onlyEnableUnitTestForTheTestedBuildType=false

# shiroikuma fork: per-build version tail. buildFork bumps it after every successful build;
# the upstream-new-version skill resets it to 1 when we rebase onto a new upstream release.
BUILD_NUMBER=3
